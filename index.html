<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Avaliações Mais Fit</title>
<style>
:root{--preto:#0d0d0d;--card:#161310;--card2:#1d1a15;--amarelo:#FFAE21;--branco:#ffffff;--cinza:#9a948b;--verde:#39c66d;--vermelho:#e0563f;--borda:#2a2620;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--preto);color:var(--branco);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:16px;max-width:900px;margin:0 auto}
.topo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 16px}
.logo{width:78px;height:78px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 2px var(--amarelo)}
.topo h1{font-size:22px;font-weight:800;letter-spacing:.3px}
.topo p{color:var(--amarelo);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.linha{height:1px;background:var(--borda);margin:6px 0 18px}
.hero{border:2px solid var(--amarelo);border-radius:16px;background:linear-gradient(180deg,#241d10,#161310);padding:20px;text-align:center}
.hero .mes{color:var(--amarelo);font-weight:800;letter-spacing:2px;font-size:15px;margin-bottom:14px}
.hero .nums{display:flex;align-items:center;justify-content:center;gap:14px}
.hero .big{font-size:52px;font-weight:800;line-height:1}
.hero .barra{color:var(--cinza);font-size:34px}
.hero .rot{color:var(--cinza);font-size:13px;margin-top:4px}
.prog{height:12px;background:#2c2820;border-radius:8px;overflow:hidden;margin:16px 0 10px}
.prog>div{height:100%;border-radius:8px;transition:width .4s,background .4s}
.hero .pct{font-weight:700;font-size:14px}
.sec{margin:22px 0 10px;color:var(--amarelo);font-weight:800;font-size:14px;letter-spacing:.5px}
.sec small{color:var(--cinza);font-weight:600;text-transform:none;letter-spacing:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.dia{flex:0 0 auto;width:52px;height:64px;background:var(--card);border:1px solid var(--borda);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dia .d{color:var(--branco);font-weight:700;font-size:13px}
.dia .q{font-weight:800;font-size:17px}
.dia .q.tem{color:var(--verde)}
.dia .q.zero{color:#5c574e}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:16px 8px;text-align:center}
.kpi .v{font-size:30px;font-weight:800;color:var(--amarelo)}
.kpi .l{color:var(--branco);font-size:12px;margin-top:4px}
.profbox{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:6px 16px}
.profrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--borda)}
.profrow:last-child{border-bottom:none}
.profrow .n{color:var(--branco);font-weight:600}
.profrow .c{color:var(--amarelo);font-weight:700}
.hist{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.mcard{flex:0 0 auto;width:150px;background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px;cursor:pointer;transition:.2s}
.mcard:hover{border-color:var(--amarelo)}
.mcard.ativo{border-color:var(--amarelo);background:linear-gradient(180deg,#2a2110,#161310)}
.mcard .mn{color:var(--amarelo);font-weight:700;font-size:14px;margin-bottom:8px}
.mcard .mt{color:var(--branco);font-size:32px;font-weight:800;line-height:1}
.mcard .mp{font-size:12px;font-weight:700;margin-top:6px}
.rodape{text-align:center;color:var(--cinza);font-size:12px;margin:20px 0 8px;padding-top:16px;border-top:1px solid var(--borda)}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.hero .big{font-size:42px}}

.promo{margin-top:26px;border:1px solid var(--borda);border-radius:14px;background:linear-gradient(180deg,#1a1510,#141210);padding:16px}
.promo .ttl{color:var(--amarelo);font-weight:800;font-size:14px;letter-spacing:.5px}
.promo .sub{color:var(--cinza);font-size:12px;margin:2px 0 14px}
.promo .grid{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.pcard{flex:0 0 auto;width:230px;background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px}
.pcard .pm{color:var(--amarelo);font-weight:700;font-size:14px}
.pcard .pt{font-size:26px;font-weight:800;color:var(--branco);margin:4px 0 10px}
.pcard .pt small{font-size:13px;color:var(--cinza);font-weight:600}
.pcard .kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid var(--borda)}
.pcard .kv .k{color:var(--cinza)}.pcard .kv .v{color:var(--branco);font-weight:600}

.dia.clic{cursor:pointer}
.dia.sel{border-color:var(--amarelo);background:linear-gradient(180deg,#2a2110,#161310)}
.q.xzero{color:var(--vermelho);font-weight:800}
.daydetail{margin:16px 0 6px;border:1px solid var(--amarelo);border-radius:14px;background:linear-gradient(180deg,#241d10,#161310);padding:14px}
.daydetail .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.daydetail .dtag{color:var(--amarelo);font-weight:800;font-size:13px;letter-spacing:.5px}
.daydetail .dbig{font-size:30px;font-weight:800;color:var(--branco);line-height:1;margin-top:4px}
.daydetail .dbig small{font-size:13px;color:var(--cinza);font-weight:600}
.dback{background:#2c2820;color:var(--branco);border:1px solid var(--borda);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.dback:hover{border-color:var(--amarelo)}
.daynote{color:var(--cinza);font-size:12px;margin-top:10px;line-height:1.4}
.daydetail .sec{margin:14px 0 8px}
</style>
</head>

  <div><h1>Avaliações Físicas</h1><p>Mais Fit Academia</p></div>
</div>
<div class="linha"></div>
<div id="app"></div>

<div class="promo">
  <div class="ttl">PROMOÇÃO — fora da meta</div>
  <div class="sub">Ação pontual (pacote semestral/anual). Não entra no total do mês. Só KPIs + mês de referência.</div>
  <div class="grid" id="promoGrid"></div>

</div>
<div class="rodape" id="rodape"></div>
<script>
let DATA = {};

const META = 50;
const cor = p => p>=100 ? 'var(--verde)' : 'var(--vermelho)';
let selDay=null, curM=null;
function daysInMonth(m){ return new Date(2026, m, 0).getDate(); }
function isPast(m,day){ const t=new Date(); t.setHours(0,0,0,0); return new Date(2026,m-1,day) < t; }
function profList(profs){
  const e=Object.entries(profs||{}).filter(p=>p[1]).sort((a,b)=>b[1]-a[1]);
  return e.map(p=>`<div class="profrow"><div class="n">${p[0]}</div><div class="c">${p[1]} aval.</div></div>`).join('') || '<div class="profrow"><div class="n" style="color:var(--cinza)">Sem registro por professor</div></div>';
}
function monthKpis(d){
  const showGen = d.M!==null, showPerf = d.mat!==null;
  let kpis='';
  if(showGen) kpis += `<div class="kpi"><div class="v">${d.M}</div><div class="l">Mulheres</div></div><div class="kpi"><div class="v">${d.H}</div><div class="l">Homens</div></div>`;
  if(showPerf) kpis += `<div class="kpi"><div class="v">${d.mat}</div><div class="l">Renovação</div></div><div class="kpi"><div class="v">${d.novo}</div><div class="l">Aluno Novo</div></div>`;
  const kpiBlock = kpis ? `<div class="sec">KPIs do Mês</div><div class="kpis">${kpis}</div>` : '';
  return `${kpiBlock}<div class="sec">Professores (${d.nome})</div><div class="profbox">${profList(d.profs)}</div>`;
}
function dayView(m,i){
  const d=DATA.meses[m]; const dd=d.det[i];
  const hasGen = dd.M!==undefined || dd.H!==undefined;
  const hasPerf = dd.mat!==undefined || dd.novo!==undefined;
  let kpis='';
  if(hasGen) kpis += `<div class="kpi"><div class="v">${dd.M||0}</div><div class="l">Mulheres</div></div><div class="kpi"><div class="v">${dd.H||0}</div><div class="l">Homens</div></div>`;
  if(hasPerf) kpis += `<div class="kpi"><div class="v">${dd.mat||0}</div><div class="l">Renovação</div></div><div class="kpi"><div class="v">${dd.novo||0}</div><div class="l">Aluno Novo</div></div>`;
  const kpiBlock = kpis ? `<div class="kpis">${kpis}</div>` : '';
  const profBlock = dd.profs ? `<div class="sec">Professores do dia</div><div class="profbox">${profList(dd.profs)}</div>` : '';
  let nota='';
  if(!hasGen && !hasPerf && !dd.profs) nota = `<div class="daynote">Neste mês só temos a quantidade por dia — o detalhe (gênero, perfil e professor) não foi registrado dia a dia.</div>`;
  else if(!hasGen) nota = `<div class="daynote">Gênero não registrado por dia neste mês.</div>`;
  return `<div class="daydetail">
    <div class="dhead"><div><div class="dtag">Dia ${i} de ${d.nome}</div><div class="dbig">${dd.q} <small>${dd.q>1?'avaliações':'avaliação'}</small></div></div><button class="dback" onclick="toggleDay(${m},${i})">← voltar ao mês</button></div>
    ${kpiBlock}${nota}${profBlock}
  </div>`;
}
function toggleDay(m,i){ selDay = (selDay===i)?null:i; render(m); }
function render(m){
  m=+m;
  if(m!==curM){ selDay=null; curM=m; }
  const d = DATA.meses[m];
  const pct = Math.round(d.total/META*100);
  const faltam = Math.max(0, META-d.total);
  const dim = daysInMonth(m);
  let dias='';
  for(let i=1;i<=dim;i++){
    const q=d.dia[i-1];
    const tem = q && q>0;
    let inner,cls,click='';
    if(tem){ inner=q; cls='tem'; click=`onclick="toggleDay(${m},${i})"`; }
    else if(d.temDia && isPast(m,i)){ inner='✕'; cls='xzero'; }
    else { inner='—'; cls='zero'; }
    const sel=(selDay===i)?' sel':'';
    dias += `<div class="dia${tem?' clic':''}${sel}" ${click}><div class="d">${i}</div><div class="q ${cls}">${inner}</div></div>`;
  }
  const mid = selDay!==null ? dayView(m,selDay) : monthKpis(d);
  let hist='';
  Object.keys(DATA.meses).sort((a,b)=>b-a).forEach(k=>{
    const mm=DATA.meses[k]; const pp=Math.round(mm.total/META*100);
    hist += `<div class="mcard ${(+k)===m?'ativo':''}" onclick="render(${k})"><div class="mn">${mm.nome}</div><div class="mt">${mm.total}</div><div class="mp" style="color:${cor(pp)}">${pp}% da meta</div></div>`;
  });
  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="mes">${d.nome.toUpperCase()} ${d.ano}</div>
      <div class="nums"><div class="big" style="color:var(--amarelo)">${d.total}</div><div class="barra">/</div><div class="big" style="color:var(--amarelo)">${META}</div></div>
      <div style="display:flex;justify-content:center;gap:60px"><div class="rot">Realizado</div><div class="rot">Meta</div></div>
      <div class="prog"><div style="width:${Math.min(100,pct)}%;background:${cor(pct)}"></div></div>
      <div class="pct" style="color:${cor(pct)}">${pct}% da meta ${faltam>0?'| Faltam '+faltam+' avaliações':'| Meta batida'}</div>
    </div>
    <div class="sec">Dia a Dia <small>— ${selDay!==null?'vendo o dia '+selDay+', toque de novo pra voltar':'toque num dia verde pra ver o detalhe'}</small></div>
    <div class="strip">${dias}</div>
    ${mid}
    <div class="sec">Histórico <small>— clique para ver outros meses</small></div>
    <div class="hist">${hist}</div>`;
  const hoje = new Date().toLocaleDateString('pt-BR');
  document.getElementById('rodape').textContent = `Atualizado em ${hoje} · ${m==DATA.atual?'Mês atual':'Vendo '+d.nome}`;
}
function renderPromo(){
  var g=document.getElementById('promoGrid'); if(!g) return;
  var promo=DATA.promo||{};
  var html='';
  Object.keys(promo).sort(function(a,b){return a-b;}).forEach(function(k){
    var p=promo[k];
    var rows='';
    var e=Object.entries(p.profs||{}).filter(function(x){return x[1];}).sort(function(a,b){return b[1]-a[1];});
    if(p.total>0){
      rows+='<div class="kv"><span class="k">Mulheres / Homens</span><span class="v">'+(p.M||0)+' / '+(p.H||0)+'</span></div>';
      rows+='<div class="kv"><span class="k">Renovação / Novo</span><span class="v">'+(p.mat||0)+' / '+(p.novo||0)+'</span></div>';
      rows+=e.map(function(x){return '<div class="kv"><span class="k">'+x[0]+'</span><span class="v">'+x[1]+'</span></div>';}).join('');
    } else {
      rows+='<div class="kv"><span class="k">Sem promoção no mês</span><span class="v">—</span></div>';
    }
    html+='<div class="pcard"><div class="pm">'+p.nome+'</div><div class="pt">'+p.total+' <small>avaliações</small></div>'+rows+'</div>';
  });
  g.innerHTML=html;
}
fetch('dados.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
  DATA=d; renderPromo(); render(DATA.atual);
}).catch(function(err){
  document.getElementById('app').innerHTML='<p style="color:#fff;padding:20px">Não consegui carregar os dados agora. Tente atualizar a página.</p>';
});
</script>
