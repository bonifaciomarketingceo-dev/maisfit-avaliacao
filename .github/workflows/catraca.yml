name: Publicar catraca Mais Fit

on:
  workflow_dispatch:
  schedule:
    # 17:45 UTC = 14:45 Brasília, seg-sex. Roda DEPOIS do publish.yml (avaliação),
    # lê os relatórios de acesso da ENTRADA e injeta a catraca no dados.json.
    - cron: '45 17 * * 1-5'

permissions:
  contents: write

jobs:
  catraca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install google-api-python-client google-auth openpyxl pdfplumber

      - name: Montar catraca no dados.json
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python scripts/build_catraca.py

      - name: Commit do dados.json
        run: |
          git config user.name "robo-catraca"
          git config user.email "robo-catraca@users.noreply.github.com"
          git add dados.json last_seen.json catraca_hist.json
          git diff --cached --quiet || git commit -m "Atualiza catraca (automatico)"
          git push
