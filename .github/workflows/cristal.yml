name: Publicar painel Cristal

on:
  workflow_dispatch:
  schedule:
    - cron: '20 17 * * *'
    - cron: '0 21 * * *'

permissions:
  contents: write

concurrency:
  group: publicar-repo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth
      - name: Baixar cristal.json do Drive
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python scripts/fetch_cristal.py
      - name: Publicar
        run: |
          git config user.name "robo-cristal"
          git config user.email "actions@users.noreply.github.com"
          git add cristal/dados.json
          git commit -m "Atualiza painel Cristal (automatico)" || { echo "sem mudancas"; exit 0; }
          git pull --rebase
          git push
